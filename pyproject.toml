[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-silo"
version = "1.0.0"
description = "Semantic anchor text and vector contiguity auditor with keyword cannibalization detection"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0"
]

[project.scripts]
context-silo = "context_silo.cli:main"

[project.urls]
"Homepage" = "https://github.com/xcalibur73/context-silo"
"Cloud Engine" = "https://webaudits.pro/tools/context-silo"
"Bug Tracker" = "https://github.com/xcalibur73/context-silo/issues"
